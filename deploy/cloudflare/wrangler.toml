# wrangler.toml — the multi-tenant outreach engine (docs/cloudflare.md).
#
# One Worker fronts every workspace; each gets its own named container
# instance (its own Durable Object, database and R2 prefix). The calling
# agent — voki's trusted application — authenticates with a service token
# and drives send/CRM over HTTP. There is no cron here: when a workspace's
# sending pass runs is the caller's scheduling decision, not the engine's.

name = "openoutreach-engine"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Engine logs land in the dashboard and `wrangler tail`.
[observability]
enabled = true

# The engine container. standard-1 (½ vCPU, 4 GiB, 8 GB disk) is roomy for
# what is now a sender + CRM; billing stops when the instance sleeps.
# Image: built and pushed with `npx wrangler containers build --push -t openoutreach-engine:v4 .`
[[containers]]
class_name = "OutreachContainer"
image = "registry.cloudflare.com/5db6a7cf9dc844657c4b9ce8eb7da202/openoutreach-engine:v4"
instance_type = "standard-1"

# The named-instance binding: getContainer(OUTREACH, <workspaceId>) is both
# the address and the mutex — one job per database, ever, per workspace.
[[durable_objects.bindings]]
name = "OUTREACH"
class_name = "OutreachContainer"

[exports.OutreachContainer]
type = "durable-object"
storage = "sqlite"

# Per-workspace state lives here between runs: crm/<ws>/db.sqlite3,
# home.tar.gz, job.json. Create once with:
#   npx wrangler r2 bucket create openoutreach-crm
[[r2_buckets]]
binding = "CRM"
bucket_name = "openoutreach-crm"

# Secrets (npx wrangler secret put <NAME>):
#   OUTREACH_SERVICE_TOKEN — the bearer token the calling agent presents.
# Per-workspace configuration arrives via PUT /w/<ws>/config and is held in
# each workspace's Durable Object storage, applied as the container env.
